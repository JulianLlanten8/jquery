<!DOCTYPE html>
<html>
  <head>
    <title>Prueba - jQuery - Google.maps</title>
      <script type="text/javascript" src="https://maps.googleapis.com/maps/api/js?key=TU_API_KEY&libraries=places&callback=initMap&loading=async" async defer></script>
    <script type="text/javascript" src="jquery.js"></script>
    <script type="text/javascript" src="jquery.ui.map.js"></script>
    <script type="text/javascript">
      $(document).ready(function () {
  var mapa;
  var marcador;

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      function (position) {
        var latitude = position.coords.latitude;
        var longitude = position.coords.longitude;

        // Crear las coordenadas iniciales
        var coordenadas = new google.maps.LatLng(latitude, longitude);

        // Opciones del mapa
        var opciones = {
          center: coordenadas,
          zoom: 18,
          mapTypeId: google.maps.MapTypeId.ROADMAP
        };

        // Crear el mapa
        mapa = new google.maps.Map($('#mapa')[0], opciones);

        // Agregar marcador inicial
        ponCoordenadas(coordenadas);

        // Listener para clicks en el mapa
        google.maps.event.addListener(mapa, 'click', function (event) {
          ponCoordenadas(event.latLng);
          $('#v_latitud').val(marcador.getPosition().lat());
          $('#v_longitud').val(marcador.getPosition().lng());
        });
      },
      function (error) {
        switch (error.code) {
          case error.PERMISSION_DENIED:
            alert("Permiso denegado para obtener la ubicación.");
            break;
          case error.POSITION_UNAVAILABLE:
            alert("La información de ubicación no está disponible.");
            break;
          case error.TIMEOUT:
            alert("El tiempo de espera para obtener la ubicación se agotó.");
            break;
          case error.UNKNOWN_ERROR:
            alert("Ocurrió un error desconocido.");
            break;
        }
      }
    );
  } else {
    alert("Geolocalización no está soportada por este navegador.");
  }

  // Función para manejar el marcador
  function ponCoordenadas(location) {
    if (marcador) {
      marcador.setPosition(location);
    } else {
      marcador = new google.maps.Marker({
        position: location,
        draggable: true,
        title: 'Arrastrar para marcar nuevas coordenadas.',
        map: mapa
      });
    }
  }

  // Botón para reiniciar
  $("#b_reset").click(function () {
    location.reload();
  });
});

  </script>  
  <style>
    div#mapa {width: 500px;height:500px;}
    .cbr     {width: 500px; height:50px;}
  </style>
  </head>
  <body>
    <table border=1 bgcolor="#58FAF4">
      <tr>
        <td colspan=2><input type="button" value="Reset" id="b_reset" class="cbr"/></td>
      </tr>
      <tr><td colspan=2><div id="mapa"></div></td></tr>  
      <tr>
      <tr>
        <td>
          <label>Latitud</label>
          <input type="text" value="41.38656929469948" id="v_latitud" disabled/>
        </td>
        <td>
          <label>Longitud</label>
          <input type="text" value="2.1648001670837402" id="v_longitud" disabled/>
        </td>
      </tr>  
      <tr>
